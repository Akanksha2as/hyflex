<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <title>Text Over Image</title>
    <style>
        
        body {
            margin: 0;
            padding: 0;
            background-image: url('mainpage1.jpeg'); 
            background-size: contain; 
            background-position: center; 
            font-family: Arial, sans-serif; 
        }
         .overlay {
            position: relative;
        }

        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container-fluid fullscreen-image">
    <img src="mainpage1.jpeg" class="img-fluid" alt="Overlay Image">
            <div class="overlay-text">
                <button type="button" class="btn btn-primary"><h1>Get Started</h1></button>
            </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
